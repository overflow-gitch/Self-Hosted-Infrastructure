services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      LOG_TARGETS: stdout
    volumes:
    - ${PRIVATE_CONFIG_PATH}/homepage:/app/config
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.homepage.rule=Host(`home.${HOST}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls.certresolver=duckdns"
      - "traefik.http.routers.homepage.middlewares=authentik@docker"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

      - "traefik.docker.network=proxy"
  
networks:
  proxy:
    external: true